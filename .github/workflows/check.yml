name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-8.2.6
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: Install Playwright Browsers
        run: npx --prefix server playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:api
      - run: npm run test:e2e
      - run: npm audit --prefix server --audit-level=high
      - run: npm audit --prefix client --audit-level=high
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            server/playwright-report
            server/test-results
          if-no-files-found: ignore

